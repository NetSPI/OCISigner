name: Unit Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (jdk${{ matrix.java-version }}) [${{ github.ref_name }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["25"]

    steps:
      # v6.0.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      # v5.2.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Run unit tests
        run: mvn -B test
